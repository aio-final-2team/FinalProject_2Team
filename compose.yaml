services:
  api:
    image: ${API_IMAGE:-yuchion-api:local}
    pull_policy: never
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &api-environment
      MEDIA_DIR: ${MEDIA_DIR:-/media}
      DATA_BACKEND: ${DATA_BACKEND:-mock}
      SEED_DEMO: ${SEED_DEMO:-true}
      RUN_IN: ${RUN_IN:-api}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      REQUEST_AGENT: ${REQUEST_AGENT:-app.modules.requests.agent_stub:run_request}
      DATABASE_URL: ${DATABASE_URL:-postgresql://yuchion:yuchion-local@db:5432/yuchion}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me-32-bytes-min}
      JWT_ACCESS_TTL_HOURS: ${JWT_ACCESS_TTL_HOURS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      HOLIDAYS: ${HOLIDAYS:-}
      WORK_HOURS: ${WORK_HOURS:-09:00-18:00}
      IMMEDIATE_RISK_CATEGORIES: ${IMMEDIATE_RISK_CATEGORIES:-child_safety}
      MOCK_STREAM_DELAY_MS: ${MOCK_STREAM_DELAY_MS:-300}
      DAILY_NOTE_WRITER: ${DAILY_NOTE_WRITER:-app.modules.daily_notes.stub_writer:write}
      DAILY_NOTE_WRITER_TIMEOUT: ${DAILY_NOTE_WRITER_TIMEOUT:-300}
      NOTE_DRAFT_CONCURRENCY: ${NOTE_DRAFT_CONCURRENCY:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LAW_GO_KR_OC: ${LAW_GO_KR_OC:-}
      DATA_GO_KR_API_KEY: ${DATA_GO_KR_API_KEY:-}
      LLM_MODEL_DEFAULT: ${LLM_MODEL_DEFAULT:-gpt-6-luna}
      LLM_MODEL_SUPERVISOR: ${LLM_MODEL_SUPERVISOR:-}
      LLM_MODEL_DOCUMENT: ${LLM_MODEL_DOCUMENT:-}
      LLM_MODEL_MEMORY: ${LLM_MODEL_MEMORY:-}
      LLM_MODEL_CHECKER: ${LLM_MODEL_CHECKER:-}
      LLM_MODEL_CODE: ${LLM_MODEL_CODE:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    volumes:
      - media_data:${MEDIA_DIR:-/media}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    profiles: [worker]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    image: ${API_IMAGE:-yuchion-api:local}
    pull_policy: never
    restart: unless-stopped
    profiles: [worker]
    environment: *api-environment
    # 마이그레이션·시드는 API 하나만 해요. threads는 DB 엔진의 fork 공유를 피해요.
    entrypoint: ["celery"]
    command: ["-A", "app.worker:celery_app", "worker", "-Q", "default,notes", "--pool=threads", "--concurrency=${WORKER_CONCURRENCY:-4}", "--loglevel=INFO"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker:celery_app inspect ping -d celery@$$HOSTNAME --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: ${API_IMAGE:-yuchion-api:local}
    pull_policy: never
    restart: unless-stopped
    profiles: [worker]
    environment: *api-environment
    entrypoint: ["celery"]
    command: ["-A", "app.worker:celery_app", "beat", "--schedule=/tmp/yuchion-celerybeat", "--loglevel=INFO"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yuchion}
      POSTGRES_USER: ${POSTGRES_USER:-yuchion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yuchion-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yuchion} -d ${POSTGRES_DB:-yuchion}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  media_data:
