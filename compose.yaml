services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://yuchion:yuchion-local@db:5432/yuchion}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yuchion}
      POSTGRES_USER: ${POSTGRES_USER:-yuchion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yuchion-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yuchion} -d ${POSTGRES_DB:-yuchion}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
