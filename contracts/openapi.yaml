openapi: 3.1.0
info:
  title: 유치온 API
  description: T13 API 설계 문서(Docs/Step2/API_설계_문서.md)의 엔드포인트. DATA_BACKEND=mock은 메모리
    데모 데이터, db는 PostgreSQL을 사용해요. DB 지원 범위는 apps/api/README.md의 진행표를 봐 주세요.
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - 인증
      summary: 로그인, 토큰 발급 (FR-01)
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me:
    get:
      tags:
      - 인증
      summary: 내 정보 (FR-01)
      operationId: me_api_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/children/{child_id}/pickup-guardians:
    get:
      tags:
      - 학부모 요청
      summary: 등록 인계자 목록 (T46 팀 확인 전 초안)
      operationId: pickup_guardians_api_v1_children__child_id__pickup_guardians_get
      security:
      - HTTPBearer: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Child Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupGuardiansOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
  /api/v1/care-requests:
    get:
      tags:
      - 학부모 요청
      summary: 교직원 투약·귀가 요청 목록 (T46 팀 확인 전 초안)
      operationId: care_requests_api_v1_care_requests_get
      security:
      - HTTPBearer: []
      parameters:
      - name: classroom_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Classroom Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - received
            - assigned
            - completed
            - rejected
            type: string
          - type: 'null'
          title: Status
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - -created_at
          - created_at
          - -updated_at
          - updated_at
          type: string
          default: -created_at
          title: Sort
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareRequestList'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
