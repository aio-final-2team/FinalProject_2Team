# Docker Compose 2.24.4 이상. 기존 서버의 80/443 앞단은 따로 유지해요.
services:
  api:
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATA_BACKEND: ${DATA_BACKEND:-db}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL을 설정해 주세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 설정해 주세요}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS를 설정해 주세요}
    ports: !override
      - "127.0.0.1:${SERVER_API_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    environment:
      APP_ENV: production
      DATA_BACKEND: ${DATA_BACKEND:-db}

  beat:
    environment:
      APP_ENV: production
      DATA_BACKEND: ${DATA_BACKEND:-db}

  web:
    restart: unless-stopped
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL을 설정해 주세요}
    ports: !override
      - "127.0.0.1:${SERVER_WEB_PORT:-15173}:80"
    depends_on:
      api:
        condition: service_healthy

  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 설정해 주세요}
    ports: !reset []
