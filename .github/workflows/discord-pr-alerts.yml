name: Discord New PR Alert

on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Read GitHub event metadata without checking out or running PR code.
      - name: Notify Discord of the new PR
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PR_ALERT_WEBHOOK }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              pr = json.load(event_file)["pull_request"]

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "")
          url = urllib.parse.urlsplit(webhook)
          if (url.scheme != "https" or url.netloc != "discord.com"
              or not re.fullmatch(r"/api/webhooks/[0-9]+/[\w-]+", url.path)
              or url.query or url.fragment):
              raise SystemExit("The DISCORD_PR_ALERT_WEBHOOK secret is missing or invalid.")

          number = int(pr["number"])
          title = " ".join(pr["title"].split())[:220]
          title = re.sub(r'([\\`*_~|<>#\[\]()])', r'\\\1', title)
          author = pr["user"]["login"]
          status = "초안 PR" if pr["draft"] else "새 PR 열림"
          next_action = (
              "리뷰 준비 예정 시간을 확인해 주세요." if pr["draft"]
              else "리뷰 담당자와 검토 가능 시간을 확인해 주세요."
          )
          pr_url = f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/pull/{number}'
          content = "\n".join([
              "📌 **[PR 알림] Final_2팀 GitHub PR**",
              f"**PR #{number} · {title}**",
              f"작성자: {author} | 상태: {status}",
              f"PM 할 일: {next_action}",
              f"PR 링크: {pr_url}",
          ])
          payload = {"content": content, "allowed_mentions": {"parse": []}}
          request = urllib.request.Request(
              webhook + "?wait=true",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "Final2team-PR-Alerts/1.0"},
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  message = json.load(response)
                  if not message.get("id"):
                      raise SystemExit("Discord did not confirm the message.")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Discord delivery failed (HTTP {error.code}).") from None
          except (urllib.error.URLError, TimeoutError):
              raise SystemExit("Discord delivery could not be confirmed.") from None
          print(f"Discord confirmed delivery for PR #{number}.")
          PY
