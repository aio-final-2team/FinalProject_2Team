name: Manual Deploy (Docker Compose)

# NFR-08 & NFR-13:
# - PR마다 자동 운영 배포는 수행하지 않고(NFR-13), 승인된 시점에만 workflow_dispatch로 수동 배포를 실행합니다.
# - AWS EC2(aws-ec2)에 동일한 Docker Compose 구성을 배포합니다(NFR-08, D14).
on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "배포 대상 환경 (aws-ec2: AWS EC2)"
        required: true
        default: "aws-ec2"
        type: choice
        options:
          - aws-ec2
      git_ref:
        description: "배포할 브랜치 또는 커밋/태그"
        required: true
        default: "develop"
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  verify-build:
    name: Verify ${{ matrix.name }} image before deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - name: dashboard
            context: apps/dashboard
            dockerfile: apps/dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}
      - name: Build image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "yuchion/${{ matrix.name }}:${{ github.sha }}" "${{ matrix.context }}"

  deploy:
    name: Deploy to ${{ inputs.target_env }}
    needs: verify-build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    steps:
      - name: Validate required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::error::Required deployment secrets (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH) are not configured for environment '${{ inputs.target_env }}'."
            exit 1
          fi

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy with Docker Compose and run smoke check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GIT_REF: ${{ inputs.git_ref }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' GIT_REF='${GIT_REF}' bash -s" << 'EOF'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch --all --prune
          git checkout "$GIT_REF"
          git pull --ff-only origin "$GIT_REF" || true

          docker compose up -d --build --remove-orphans

          echo "Waiting for API health check (/health)..."
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "API health check passed."
              docker compose ps
              exit 0
            fi
            sleep 2
          done

          echo "API health check failed after retries."
          docker compose ps
          docker compose logs --tail=50 api
          exit 1
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
