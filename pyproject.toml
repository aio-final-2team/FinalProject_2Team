[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuchion"
version = "0.1.0"
description = "Yuchion kindergarten communication and agent workflow service"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "app*"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
